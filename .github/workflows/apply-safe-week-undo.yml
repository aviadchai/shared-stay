name: Apply safe week undo patch

on:
  push:
    branches:
      - fix/safe-week-undo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safe-week-undo
      - name: Patch app safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once('<meta name="shared-stay-version" content="6">', '<meta name="shared-stay-version" content="8">', 'app version')
          replace_once('.sync.err i{background:#d35c50}', '.sync.err i{background:#d35c50}.undoMini{margin-inline-start:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 9px;font-size:9px;font-weight:850;color:#46504d;line-height:1.2}.undoMini:disabled{opacity:.35;cursor:default}', 'undo css')
          replace_once('max-width:80px;overflow:hidden', 'max-width:106px;overflow:hidden', 'week action width')
          replace_once('<div class="sync" id="sync"><i></i><span id="syncText">טוען…</span></div>', '<div class="sync" id="sync"><i></i><span id="syncText">טוען…</span><button class="undoMini" id="undoBtn" type="button" title="אין שינוי לחזור אליו" aria-label="חזרה לשינוי האחרון" disabled>↶ חזרה</button></div>', 'undo button')

          undo_code = '''function cloneState(x){return JSON.parse(JSON.stringify(x))}function undoListKey(){return"ss_undo_"+SID}function getUndoList(){try{return(JSON.parse(localStorage.getItem(undoListKey())||"[]")||[]).filter(x=>x&&x.data)}catch(e){return[]}}function setUndoList(a){localStorage.setItem(undoListKey(),JSON.stringify((a||[]).slice(0,12)))}function pushUndo(data){let a=getUndoList(),id=crypto.randomUUID();a.unshift({id,at:Date.now(),afterUpdatedAt:0,data:cloneState(data)});setUndoList(a);updateUndoButton();return id}function markUndo(id,updatedAt){let a=getUndoList(),x=a.find(v=>v.id===id);if(x){x.afterUpdatedAt=Number(updatedAt)||0;setUndoList(a)}updateUndoButton()}function updateUndoButton(){let b=$("undoBtn");if(!b)return;let a=getUndoList();b.disabled=!a.length;b.title=a.length?"חזרה לשינוי האחרון":"אין שינוי לחזור אליו"}async function undoLast(){let a=getUndoList();if(!a.length){toast("אין שינוי לחזור אליו");return}let cur=null;try{cur=JSON.parse(localStorage.getItem("ss_"+SID)||"null")}catch(e){}let u=a[0];if(u.afterUpdatedAt&&Number(cur?.updatedAt||0)!==Number(u.afterUpdatedAt)){toast("הלוח השתנה מאז — לא ביטלתי כדי לא למחוק שינוי חדש");return}a.shift();setUndoList(a);S=norm(cloneState(u.data));try{let old=localStorage.getItem(backupListKey());if(old)localStorage.setItem("ss_backups_before_undo_"+SID,old);localStorage.removeItem(backupListKey())}catch(e){}render();await saveShared(false,true);updateUndoButton();toast("השינוי האחרון בוטל")}\n'''
          marker = 'function toast(t){'
          if s.count(marker) != 1:
              raise SystemExit(f'undo insertion marker: expected exactly one match, found {s.count(marker)}')
          s = s.replace(marker, undo_code + marker, 1)

          old_quick = '<div class="quick"><button class="qa" data-fill="A" data-week="${w}">${esc(oname("A"))}</button><button class="qb" data-fill="B" data-week="${w}">${esc(oname("B"))}</button></div>'
          new_quick = '<div class="quick"><button class="qa" data-fill="A" data-week="${w}" title="שינוי כל השבוע — דורש אישור">שבוע אצל ${esc(oname("A"))}</button><button class="qb" data-fill="B" data-week="${w}" title="שינוי כל השבוע — דורש אישור">שבוע אצל ${esc(oname("B"))}</button></div>'
          replace_once(old_quick, new_quick, 'week action labels')

          replace_once('$("legB").textContent=$("statNameB").textContent=oname("B");stats();profiles();requestAnimationFrame', '$("legB").textContent=$("statNameB").textContent=oname("B");stats();profiles();updateUndoButton();requestAnimationFrame', 'undo render state')

          save_pattern = re.compile(r'async function saveShared\(\)\{.*?\}\nasync function fillWeek', re.S)
          save_match = save_pattern.search(s)
          if not save_match:
              raise SystemExit('saveShared block not found')
          new_save = '''async function saveShared(captureUndo=true,replace=false){let previous=null;try{previous=JSON.parse(localStorage.getItem("ss_"+SID)||"null")}catch(e){}let undoId=null;if(previous&&JSON.stringify(previous)!==JSON.stringify(S)&&captureUndo){archiveLocal(previous,"לפני שינוי");undoId=pushUndo(previous)}S.updatedAt=Date.now();S.version=4;if(undoId)markUndo(undoId,S.updatedAt);localStorage.setItem("ss_"+SID,JSON.stringify(S));updateUndoButton();sync("saving","שומר ומסנכרן…");try{let remote=await getDoc(REF);if(remote.exists()&&dataScore(remote.data())>0)try{await setDoc(BACKUP_REF,{...remote.data(),backupAt:Date.now()},{merge:false})}catch(e){}await setDoc(REF,S,{merge:!replace});sync("ok","מסונכרן לכל המשתמשים")}catch(e){sync("err","נשמר במכשיר · ממתין לחיבור")}}\nasync function fillWeek'''
          s = save_pattern.sub(new_save, s, count=1)

          fill_pattern = re.compile(r'async function fillWeek\(w,o\)\{.*?\}function drawStart', re.S)
          fill_match = fill_pattern.search(s)
          if not fill_match:
              raise SystemExit('fillWeek block not found')
          new_fill = '''async function fillWeek(w,o){if(!confirm(`לשנות את כל שבוע ${w+1} ל־${oname(o)}?\\n\\nהשינוי יחול על כל 7 הימים.`))return;for(let i=0;i<7;i++)S.days[key(add(view,w*7+i))]={start:o,transitions:[],marker:"",label:"",note:""};render();await saveShared();toast(`כל השבוע אצל ${oname(o)} · אפשר לחזור ↶`)}function drawStart'''
          s = fill_pattern.sub(new_fill, s, count=1)

          replace_once('$("prevBtn").onclick=()=>{view=add(view,-14);render()};', '$("undoBtn").onclick=undoLast;$("prevBtn").onclick=()=>{view=add(view,-14);render()};', 'undo handler')
          replace_once('ss_sw6_reload', 'ss_sw8_reload', 'service worker reload key')

          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          if t.count("const CACHE='shared-stay-v7';") != 1:
              raise SystemExit('service worker cache marker not found exactly once')
          t = t.replace("const CACHE='shared-stay-v7';", "const CACHE='shared-stay-v8';", 1)
          sw.write_text(t, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'id="undoBtn"' in s
          assert 'שבוע אצל ${esc(oname("A"))}' in s
          assert 'confirm(`לשנות את כל שבוע' in s
          assert 'async function undoLast()' in s
          assert 'shared-stay-version" content="8"' in s
          assert "shared-stay-v8" in Path('sw.js').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m
          Path('/tmp/shared-stay-app.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/shared-stay-app.mjs

      - name: Commit patched app and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-safe-week-undo.yml
          git add index.html sw.js
          git commit -m "Protect week bulk changes and add undo"
          git push origin HEAD:fix/safe-week-undo
