<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f1ed"><title>שבועיים יחד</title><style>:root{--a:#4f7d78;--b:#c47b57;--bg:#f3f1ed;--card:#fff;--ink:#202725;--muted:#7b817f;--line:#e6e1da}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 0 calc(env(safe-area-inset-bottom) + 24px)}button,input,select,textarea{font:inherit}.app{max-width:1000px;margin:auto;padding:0 12px}.top{display:flex;gap:9px;align-items:center;margin-bottom:12px}.title{flex:1}.title h1{font-size:23px;margin:0}.title p{font-size:12px;color:var(--muted);margin:3px 0 0}.icon{width:42px;height:42px;border:1px solid var(--line);background:var(--card);border-radius:14px}.profile{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:10px 12px;margin-bottom:12px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:white;font-weight:800}.profile .txt{flex:1}.profile b{display:block;font-size:13px}.profile small{color:var(--muted)}.mini{border:0;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:800}.nav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}.nav button{border:0;background:none;font-weight:800}.nav span{font-size:12px;color:var(--muted)}.weeks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.week{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:11px}.wh{display:flex;align-items:center;margin-bottom:8px}.wh b{flex:1}.wh span{font-size:11px;color:var(--muted)}.quick{display:flex;gap:6px;margin-bottom:7px}.quick button{flex:1;border:1px solid var(--line);background:#faf9f7;border-radius:9px;padding:7px 4px;font-size:10px;font-weight:800}.day{display:grid;grid-template-columns:46px 1fr 18px;align-items:center;gap:8px;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer}.date small{display:block;color:var(--muted);font-size:10px}.date strong{font-size:20px}.own{display:flex;align-items:center;gap:8px;min-width:0}.bar{width:9px;height:32px;border-radius:8px}.own b{display:block;font-size:13px}.own small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note{width:7px;height:7px;background:#d9a33b;border-radius:50%;display:inline-block}.legend{text-align:center;color:var(--muted);font-size:11px;margin-top:12px}.overlay{display:none;position:fixed;inset:0;background:#1c211f66;backdrop-filter:blur(4px);z-index:20;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{background:var(--card);width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:23px 23px 0 0;padding:18px 15px calc(env(safe-area-inset-bottom) + 18px)}.sheet h2{font-size:18px;margin:0 0 4px}.desc{font-size:11px;color:var(--muted);margin-bottom:14px}.field{margin-bottom:12px}.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#faf9f7;border-radius:11px;padding:11px;outline:none}.field textarea{min-height:85px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg{display:flex;gap:7px}.seg button{flex:1;border:1px solid var(--line);background:#faf9f7;border-radius:11px;padding:11px;font-weight:800}.seg .a{border-color:var(--a);color:var(--a)}.seg .b{border-color:var(--b);color:var(--b)}.private{background:#fff9ed;border:1px solid #eadcb9;border-radius:13px;padding:11px}.actions{display:flex;gap:7px;margin-top:13px}.btn{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800}.primary{background:var(--ink);color:white}.ghost{background:#eeece7}.colors{display:flex;gap:8px}.colors>div{flex:1}.colors input[type=color]{height:44px;padding:3px}.login{display:grid;grid-template-columns:1fr 1fr;gap:8px}.person{border:1px solid var(--line);border-radius:14px;padding:13px;text-align:center}.person i{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:white;font-style:normal;font-weight:900;margin:0 auto 7px}.person button{width:100%;margin-top:8px;border:0;background:var(--ink);color:#fff;border-radius:9px;padding:8px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#202725;color:#fff;border-radius:99px;padding:9px 14px;font-size:11px;opacity:0;transition:.2s;z-index:50}.toast.on{opacity:1}@media(max-width:720px){.weeks{grid-template-columns:1fr}.top{position:sticky;top:0;background:var(--bg);z-index:5;padding-top:3px}.title h1{font-size:20px}.two{grid-template-columns:1fr}.week{border-radius:17px}}@media(max-width:380px){.title p{display:none}.day{grid-template-columns:42px 1fr 16px}}</style></head><body><main class="app"><header class="top"><div class="title"><h1>שבועיים יחד</h1><p>לוח שהות פשוט וגמיש לשני הורים</p></div><button class="icon" id="share">↗</button><button class="icon" id="settings">⚙</button></header><section class="profile"><div class="avatar" id="av">?</div><div class="txt"><b id="pt">מצב אורח</b><small id="ps">הלוח משותף · ההערות האישיות נשארות במכשיר שלך</small></div><button class="mini" id="profiles">פרופיל אישי</button></section><nav class="nav"><button id="next">שבועיים הבאים ←</button><span id="range"></span><button id="prev">→ שבועיים קודמים</button></nav><div class="weeks" id="weeks"></div><div class="legend">לחיצה על יום לעריכה · נקודה צהובה = יש לך הערה אישית</div></main><div class="overlay" id="dayOv"><div class="sheet"><h2 id="dayTitle"></h2><div class="desc">השינוי משפיע על היום הזה בלבד</div><div class="field"><label>אצל מי?</label><div class="seg" id="seg"></div></div><div class="two"><div class="field"><label>שעת החלפה</label><input type="time" id="time"></div><div class="field"><label>אופן החלפה</label><input id="method" placeholder="איסוף מהגן"></div></div><div class="private"><div class="field"><label>הערה אישית — רק בפרופיל שלך</label><textarea id="note" placeholder="למשל: להביא תיק שחייה"></textarea></div></div><div class="actions"><button class="btn ghost" data-close="dayOv">ביטול</button><button class="btn primary" id="saveDay">שמירה</button></div></div></div><div class="overlay" id="setOv"><div class="sheet"><h2>הגדרות הלוח</h2><div class="desc">אפשר לשנות הכול גם בהמשך</div><div class="two"><div class="field"><label>הורה א׳</label><input id="nameA"></div><div class="field"><label>הורה ב׳</label><input id="nameB"></div></div><div class="colors"><div class="field"><label>צבע הורה א׳</label><input type="color" id="colorA"></div><div class="field"><label>צבע הורה ב׳</label><input type="color" id="colorB"></div></div><div class="two"><div class="field"><label>שעת החלפה ברירת מחדל</label><input type="time" id="defTime"></div><div class="field"><label>אופן החלפה</label><input id="defMethod"></div></div><div class="actions"><button class="btn ghost" data-close="setOv">ביטול</button><button class="btn primary" id="saveSet">שמירה</button></div></div></div><div class="overlay" id="profOv"><div class="sheet"><h2>מי משתמש עכשיו?</h2><div class="desc">הבחירה משנה רק את ההערות האישיות במכשיר הזה</div><div class="login" id="people"></div><div class="actions"><button class="btn ghost" id="guest">מצב אורח</button><button class="btn primary" data-close="profOv">סיום</button></div></div></div><div class="toast" id="toast"></div><script>const $=x=>document.getElementById(x),D=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'],M=['ינו׳','פבר׳','מרץ','אפר׳','מאי','יוני','יולי','אוג׳','ספט׳','אוק׳','נוב׳','דצמ׳'];let S=JSON.parse(localStorage.getItem('stay_shared')||'null')||{names:{A:'הורה א׳',B:'הורה ב׳'},colors:{A:'#4f7d78',B:'#c47b57'},time:'17:00',method:'איסוף',days:{}};let profile=localStorage.getItem('stay_profile')||'',view=monday(new Date()),edit='',owner='A';function monday(d){d=new Date(d);d.setHours(12,0,0,0);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d}function add(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}function key(d){return d.toISOString().slice(0,10)}function data(d){return S.days[key(d)]||{owner:((Math.floor((d-monday(new Date(2026,0,5)))/604800000)%2+2)%2?'B':'A'),time:S.time,method:S.method}}function notes(){return JSON.parse(localStorage.getItem('stay_notes_'+profile)||'{}')}function saveNotes(n){if(profile)localStorage.setItem('stay_notes_'+profile,JSON.stringify(n))}function save(){localStorage.setItem('stay_shared',JSON.stringify(S))}function pop(t){$('toast').textContent=t;$('toast').classList.add('on');setTimeout(()=>$('toast').classList.remove('on'),1300)}function render(){document.documentElement.style.setProperty('--a',S.colors.A);document.documentElement.style.setProperty('--b',S.colors.B);let ns=notes();$('range').textContent=view.getDate()+' '+M[view.getMonth()]+' — '+add(view,13).getDate()+' '+M[add(view,13).getMonth()];let h='';for(let w=0;w<2;w++){let ws=add(view,w*7),we=add(ws,6);h+=`<section class="week"><div class="wh"><b>שבוע ${w+1}</b><span>${ws.getDate()} ${M[ws.getMonth()]}–${we.getDate()} ${M[we.getMonth()]}</span></div><div class="quick"><button data-fill="A" data-w="${w}">כל השבוע אצל ${S.names.A}</button><button data-fill="B" data-w="${w}">כל השבוע אצל ${S.names.B}</button></div>`;for(let i=0;i<7;i++){let d=add(ws,i),x=data(d),k=key(d);h+=`<div class="day" data-k="${k}"><div class="date"><small>יום ${D[d.getDay()]}</small><strong>${d.getDate()}</strong></div><div class="own"><i class="bar" style="background:${S.colors[x.owner]}"></i><div><b>${S.names[x.owner]}</b><small>${x.time} · ${x.method||'ללא פירוט'}</small></div></div><span>${ns[k]?'<i class="note"></i>':'‹'}</span></div>`}h+='</section>'}$('weeks').innerHTML=h;document.querySelectorAll('.day').forEach(e=>e.onclick=()=>openDay(e.dataset.k));document.querySelectorAll('[data-fill]').forEach(e=>e.onclick=()=>{for(let i=0;i<7;i++){let d=add(view,+e.dataset.w*7+i);S.days[key(d)]={owner:e.dataset.fill,time:S.time,method:S.method}}save();render();pop('השבוע עודכן')});$('av').style.background=profile?S.colors[profile]:'#999';$('av').textContent=profile?S.names[profile][0]:'?';$('pt').textContent=profile?'מחובר/ת כ'+ ' '+S.names[profile]:'מצב אורח';$('ps').textContent=profile?'ההערות האישיות שלך נשמרות רק במכשיר הזה':'הלוח משותף · אין הערות אישיות במצב אורח'}function drawSeg(){$('seg').innerHTML=`<button data-o="A" class="${owner==='A'?'a':''}">${S.names.A}</button><button data-o="B" class="${owner==='B'?'b':''}">${S.names.B}</button>`;document.querySelectorAll('#seg button').forEach(e=>e.onclick=()=>{owner=e.dataset.o;drawSeg()})}function openDay(k){edit=k;let d=new Date(k+'T12:00:00'),x=data(d);owner=x.owner;$('dayTitle').textContent='יום '+D[d.getDay()]+' · '+d.getDate()+' '+M[d.getMonth()];$('time').value=x.time;$('method').value=x.method;$('note').disabled=!profile;$('note').placeholder=profile?'למשל: להביא תיק שחייה':'היכנס/י לפרופיל אישי כדי לכתוב הערה';$('note').value=profile?(notes()[k]||''):'';drawSeg();$('dayOv').classList.add('show')}$('saveDay').onclick=()=>{S.days[edit]={owner,time:$('time').value||S.time,method:$('method').value.trim()||S.method};save();if(profile){let n=notes(),t=$('note').value.trim();if(t)n[edit]=t;else delete n[edit];saveNotes(n)}$('dayOv').classList.remove('show');render();pop('נשמר')};$('settings').onclick=()=>{$('nameA').value=S.names.A;$('nameB').value=S.names.B;$('colorA').value=S.colors.A;$('colorB').value=S.colors.B;$('defTime').value=S.time;$('defMethod').value=S.method;$('setOv').classList.add('show')};$('saveSet').onclick=()=>{S.names.A=$('nameA').value.trim()||'הורה א׳';S.names.B=$('nameB').value.trim()||'הורה ב׳';S.colors.A=$('colorA').value;S.colors.B=$('colorB').value;S.time=$('defTime').value||'17:00';S.method=$('defMethod').value.trim()||'איסוף';save();$('setOv').classList.remove('show');render();pop('ההגדרות נשמרו')};$('profiles').onclick=()=>{drawPeople();$('profOv').classList.add('show')};function drawPeople(){$('people').innerHTML=['A','B'].map(p=>`<div class="person"><i style="background:${S.colors[p]}">${S.names[p][0]}</i><b>${S.names[p]}</b><button data-p="${p}">${profile===p?'הפרופיל הפעיל':'כניסה'}</button></div>`).join('');document.querySelectorAll('[data-p]').forEach(e=>e.onclick=()=>{profile=e.dataset.p;localStorage.setItem('stay_profile',profile);drawPeople();render();pop('הפרופיל הוחלף')})}$('guest').onclick=()=>{profile='';localStorage.removeItem('stay_profile');$('profOv').classList.remove('show');render()};$('prev').onclick=()=>{view=add(view,-14);render()};$('next').onclick=()=>{view=add(view,14);render()};$('share').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);pop('הקישור הועתק')}catch{pop('אפשר להעתיק משורת הכתובת')}};document.querySelectorAll('[data-close]').forEach(e=>e.onclick=()=>$((e.dataset.close)).classList.remove('show'));document.querySelectorAll('.overlay').forEach(e=>e.onclick=x=>{if(x.target===e)e.classList.remove('show')});render();</script></body></html>
