function stats(){let m={A:0,B:0},c=0;for(let i=0;i<14;i++){let x=day(add(view,i));for(let s of segs(x))m[s.owner]+=s.to-s.from;c+=x.transitions.length}let tot=m.A+m.B||1,pa=Math.round(m.A/tot*100),pb=100-pa;$("barA").style.width=pa+"%";$("barB").style.width=pb+"%";$("pctA").textContent=pa+"%";$("pctB").textContent=pb+"%";$("hoursA").textContent=Math.round(m.A/60)+" שעות";$("hoursB").textContent=Math.round(m.B/60)+" שעות";$("changes").textContent=c}
async function saveShared(){S.updatedAt=Date.now();localStorage.setItem("ss_"+SID,JSON.stringify(S));sync("saving","שומר…");try{await setDoc(REF,S,{merge:false});sync("ok","מסונכרן")}catch(e){sync("err","נשמר מקומית")}}
function fillWeek(w,o){for(let i=0;i<7;i++)S.days[key(add(view,w*7+i))]={start:o,transitions:[],marker:"",label:"",note:""};saveShared();render();toast(`השבוע סומן אצל ${oname(o)}`)}function drawStart(){$("startSeg").innerHTML=`<button data-start="A" class="${editStart==="A"?"onA":""}">${esc(oname("A"))}</button><button data-start="B" class="${editStart==="B"?"onB":""}">${esc(oname("B"))}</button>`;document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{editStart=b.dataset.start;drawStart()})}
function drawTransitions(){$("transitions").innerHTML=editTransitions.length?editTransitions.map((t,i)=>`<div class="trrow"><input type="time" value="${esc(t.time)}" data-ti="${i}"><select data-to="${i}"><option value="A" ${t.to==="A"?"selected":""}>→ ${esc(oname("A"))}</option><option value="B" ${t.to==="B"?"selected":""}>→ ${esc(oname("B"))}</option></select><button data-del="${i}">×</button><div style="grid-column:1/-1"><input value="${esc(t.method||"")}" data-method="${i}" placeholder="אופן החלפה — למשל איסוף מהגן"></div></div>`).join(""):`<div class="sub" style="margin:0">אין החלפות — כל היום אצל ${esc(oname(editStart))}</div>`;document.querySelectorAll("[data-ti]").forEach(x=>x.onchange=()=>{editTransitions[+x.dataset.ti].time=x.value;drawTransitions()});document.querySelectorAll("[data-to]").forEach(x=>x.onchange=()=>editTransitions[+x.dataset.to].to=x.value);document.querySelectorAll("[data-method]").forEach(x=>x.oninput=()=>editTransitions[+x.dataset.method].method=x.value);document.querySelectorAll("[data-del]").forEach(x=>x.onclick=()=>{editTransitions.splice(+x.dataset.del,1);drawTransitions()});$("addTransition").disabled=editTransitions.length>=2;$("addTransition").textContent=editTransitions.length>=2?"עד שתי החלפות ביום":"+ הוספת החלפה"}
function openDay(k){editKey=k;let d=parse(k),x=day(d),notes=localNotes();editStart=x.start;editTransitions=x.transitions.map(t=>({...t}));$("dayTitle").textContent=`${DOW[d.getDay()]} · ${d.getDate()} ${MON[d.getMonth()]}`;$("marker").value=x.marker;$("label").value=x.label;$("sharedNote").value=x.note;drawStart();drawTransitions();$("privateWho").textContent=profile?`— ${oname(profile)}`:"— נעול";$("privateNote").disabled=!profile;$("privateBox").classList.toggle("locked",!profile);$("privateNote").value=profile?(notes[k]||""):"";$("dayOv").classList.add("show")}
$("addTransition").onclick=()=>{if(editTransitions.length>=2)return;let last=editTransitions.at(-1),from=last?.to||editStart;editTransitions.push({time:last?"20:00":S.defaultTime,to:other(from),method:S.defaultMethod});drawTransitions()};$("saveDay").onclick=async()=>{editTransitions=editTransitions.filter(t=>t.time).sort((a,b)=>a.time.localeCompare(b.time));S.days[editKey]={start:editStart,transitions:editTransitions,marker:$("marker").value,label:$("label").value.trim(),note:$("sharedNote").value.trim()};if(profile){let n=localNotes();n[editKey]=$("privateNote").value;saveLocalNotes(n)}await saveShared();$("dayOv").classList.remove("show");render();toast("היום נשמר")};$("resetDay").onclick=async()=>{delete S.days[editKey];if(profile){let n=localNotes();delete n[editKey];saveLocalNotes(n)}await saveShared();$("dayOv").classList.remove("show");render();toast("היום אופס")};
function drawFirst(){$("firstWeekSeg").innerHTML=`<button data-fw="A" class="${firstWeekOwner==="A"?"onA":""}">${esc(oname("A"))}</button><button data-fw="B" class="${firstWeekOwner==="B"?"onB":""}">${esc(oname("B"))}</button>`;document.querySelectorAll("[data-fw]").forEach(b=>b.onclick=()=>{firstWeekOwner=b.dataset.fw;drawFirst()})}$("settingsBtn").onclick=()=>{$("nameA").value=S.names.A;$("nameB").value=S.names.B;$("colorA").value=S.colors.A;$("colorB").value=S.colors.B;$("defaultTime").value=S.defaultTime;$("defaultMethod").value=S.defaultMethod;$("pattern").value=S.pattern;firstWeekOwner=S.anchorOwner;drawFirst();$("settingsOv").classList.add("show")};$("saveSettings").onclick=async()=>{S.names.A=$("nameA").value.trim()||"הורה א׳";S.names.B=$("nameB").value.trim()||"הורה ב׳";S.colors.A=$("colorA").value;S.colors.B=$("colorB").value;S.defaultTime=$("defaultTime").value||"17:00";S.defaultMethod=$("defaultMethod").value.trim()||"איסוף";S.pattern=$("pattern").value;S.anchorOwner=firstWeekOwner;S.anchor=key(view);await saveShared();$("settingsOv").classList.remove("show");render();toast("ההגדרות נשמרו")};$("applyPattern").onclick=async()=>{S.pattern=$("pattern").value;S.anchorOwner=firstWeekOwner;S.anchor=key(view);for(let i=0;i<14;i++)delete S.days[key(add(view,i))];await saveShared();render();toast("הדפוס הוחל")};
function profiles(){$("profileChoices").innerHTML=["A","B"].map(o=>`<div class="profileChoice"><div class="ball" style="background:${col(o)}">${esc(oname(o)[0]||o)}</div><b>${esc(oname(o))}</b><small>${profile===o?"מחובר/ת":"פרופיל אישי"}</small><button data-prof="${o}">${profile===o?"מחובר/ת":"בחר/י"}</button></div>`).join("");document.querySelectorAll("[data-prof]").forEach(b=>b.onclick=()=>{chosenProfile=b.dataset.prof;$("profileMsg").textContent=`הפרופיל שנבחר: ${oname(chosenProfile)}`})}$("profileBtn").onclick=()=>{chosenProfile=profile||"A";$("profileCode").value="";$("profileMsg").textContent="";profiles();$("profileOv").classList.add("show")};$("unlockProfile").onclick=async()=>{let code=$("profileCode").value;if(code.length<4){$("profileMsg").textContent="הקוד צריך להכיל לפחות 4 תווים";return}let h=await hash(code),saved=localStorage.getItem(hashKey(chosenProfile));if(saved&&saved!==h){$("profileMsg").textContent="הקוד לא נכון";return}if(!saved)localStorage.setItem(hashKey(chosenProfile),h);profile=chosenProfile;sessionStorage.setItem("ss_prof_"+SID,profile);$("profileOv").classList.remove("show");render();toast(`מחובר/ת כ־${oname(profile)}`)};$("logoutProfile").onclick=()=>{profile="";sessionStorage.removeItem("ss_prof_"+SID);$("profileOv").classList.remove("show");render();toast("יצאת מהפרופיל")};
$("prevBtn").onclick=()=>{view=add(view,-14);render()};$("nextBtn").onclick=()=>{view=add(view,14);render()};$("shareBtn").onclick=async()=>{try{await navigator.share({title:"שבועיים יחד",url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);toast("הקישור הועתק")}catch(e2){prompt("העתק את הקישור",location.href)}}};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove("show"));["dayOv","settingsOv","profileOv"].forEach(id=>$(id).onclick=e=>{if(e.target===$(id))$(id).classList.remove("show")});
try{let loc=localStorage.getItem("ss_"+SID);if(loc)S=norm(JSON.parse(loc))}catch(e){}render();sync("saving","מתחבר…");onSnapshot(REF,async snap=>{if(snap.exists()){S=norm(snap.data());localStorage.setItem("ss_"+SID,JSON.stringify(S));render();sync("ok","מסונכרן")}else{await saveShared();render()}},()=>sync("err","מצב מקומי"));
</script>
</body>
</html>
